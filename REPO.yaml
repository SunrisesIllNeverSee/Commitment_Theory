standard:
  name: ello-repo-standard
  version: "1.0.0"
  mode: migrate

repo:
  name: Commitment_Theory
  type: research
  lifecycle: research
  repo_id: commitment_theory
  family: commitment-theory
  purpose: 'Commitment Theory — authored by Deric J. McHenry. Explains how deontic meaning is preserved or transformed through governed transformation of a commitment kernel containing obligations, prohibitions, and permissions. Contains the Conservation Law of Commitment. Patent Serial No. 63/877,177 (Provisional).'

structure:
  profile: research
  allowed_root_dirs_extra: [academic-research, CT, inbox, Legal_Theory, MISC, pipeline, publishing, source-threads, system-devin, ..bfg-report, docs]
  allowed_root_files_extra: [FULL_WORKFLOW_PROMPT.md, TODO.md, CT.zip]
  document_roots: [docs, CT, publishing]
  artifact_roots: [CT, MISC, artifacts]
  archive_roots: [MISC, inbox, archive, docs/archive]

naming:
  forbid_version_suffixes: true
  forbidden_suffixes: [_final, _final2, _new, _updated, _revised, _copy]

knowledge:
  okf_enabled: true
  okf_roots: [docs, CT, publishing]
  okf_severity: warn

coordination:
  micro_enabled: true
  micro_root: .coord/micro
  macro_enabled: true
  macro_root: .coord/macro
  backend: drep
  drep_root: system-devin
  owner_role: OWNER
  rep1_role: LEAD
  rep2_role: ASSIST

github:
  ruleset_profile: solo-fast
  required_check: repo-standard

canon:
  authority_role: evidence_source
  canon_contexts: [commitment-theory]
  authority_owner_repo: search_authority
